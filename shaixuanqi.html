<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>逐位筛选器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--text2:#555;--text3:#999;--pri:#4361ee;--pri-hover:#3651d4;--red:#e63946;--red-hover:#c9303e;--amber:#f0a030;--green:#2ec4b6;--border:#d9d9d9;--radius:8px;--shadow:0 1px 4px rgba(0,0,0,.07)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.app{max-width:1100px;margin:0 auto;padding:20px 16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--text)}
header h1 small{font-size:12px;font-weight:400;color:var(--text3)}
.game-sw{display:flex;gap:0;background:var(--bg);border-radius:var(--radius);padding:3px;border:1px solid var(--border)}
.game-sw button{padding:8px 20px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--text2);transition:all .2s}
.game-sw button.on{background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(67,97,238,.35)}
.game-sw button[data-game=dlt].on{background:var(--red);box-shadow:0 2px 8px rgba(230,57,70,.35)}
.main{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:860px){.main{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.panel-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.panel-title .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#f0f2f5;color:var(--text2);font-weight:500;margin-left:auto}
.exc-grid{display:flex;flex-wrap:wrap;gap:4px;max-height:140px;overflow-y:auto;padding:2px 0}
.e-ball{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:#fff;font-size:11px;font-weight:600;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;user-select:none;color:var(--text);line-height:1;flex-shrink:0}
.e-ball:hover{border-color:var(--pri);transform:scale(1.08);z-index:1}
.e-ball.exc{background:#f5f5f5;border-color:#e0e0e0;color:#ccc;opacity:.5;position:relative}
.e-ball.exc::after{content:'✕';position:absolute;font-size:12px;color:#bbb}
.exc-grid .e-blue{border-color:#aac;background:#eef2ff}
.exc-grid .e-blue.exc{background:#f5f5f5;border-color:#e0e0e0}
.pos-table{width:100%;border-collapse:collapse;font-size:12px}
.pos-table th{font-weight:600;color:var(--text2);padding:4px 3px;text-align:center;border-bottom:2px solid #eee;font-size:11px;white-space:nowrap}
.pos-table td{padding:5px 3px;text-align:center;border-bottom:1px solid #f5f5f5;vertical-align:middle}
.pos-table tr:last-child td{border-bottom:none}
.pos-label{font-weight:600;color:var(--text);font-size:12px;white-space:nowrap}
.pos-num input{width:38px;padding:4px 2px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-weight:600;text-align:center;outline:none;background:#fff;color:var(--text)}
.pos-num input:focus{border-color:var(--pri);box-shadow:0 0 0 2px rgba(67,97,238,.08)}
.pos-num input.filled{border-color:var(--pri);background:#f0f4ff}
.cp{display:inline-flex;gap:2px}
.cp button{padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:#fff;font-size:11px;font-weight:500;cursor:pointer;color:var(--text3);min-width:26px;text-align:center;line-height:1.3}
.cp button:hover{border-color:var(--pri);color:var(--pri)}
.cp button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.cp button.on.dlt{background:var(--red);border-color:var(--red)}
.avail-badge{font-size:10px;color:var(--text3);background:#f5f5f5;border-radius:8px;padding:2px 7px;white-space:nowrap;display:inline-block}
.avail-badge .n{font-weight:700;color:var(--pri)}
.sec-title{font-size:12px;font-weight:600;color:var(--text2);margin:14px 0 8px 0;display:flex;align-items:center;gap:6px;padding-bottom:6px;border-bottom:1px solid #eee}
.sec-title small{font-weight:400;color:var(--text3);font-size:11px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid #f0f0f0}
.btn{padding:9px 24px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--pri);color:#fff}.btn-primary:hover{background:var(--pri-hover)}.btn-primary:disabled{background:#a0b4f0;cursor:not-allowed;transform:none}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#25a99d}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--pri);color:var(--pri)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:var(--red-hover)}
.btn-warn{background:var(--amber);color:#fff}.btn-warn:hover{background:#d8902a}
.btn-sm{padding:6px 14px;font-size:12px}
.info-bar{font-size:12px;color:var(--text2);background:#f8f9fc;border-radius:6px;padding:10px 14px;margin-bottom:12px;min-height:38px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.info-bar .hl{font-weight:700;color:var(--pri);font-size:15px}
.info-bar .cost{color:var(--red);font-weight:600}
.info-bar .note{font-size:11px;color:var(--text3);font-weight:400}
.err-msg{font-size:12px;color:var(--red);margin-top:6px;min-height:16px}
.results{padding-top:0}
.res-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--text2);flex-wrap:wrap;gap:6px}
.res-list{max-height:480px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.ri{display:flex;align-items:center;gap:5px;padding:6px 10px;background:#f8f9fc;border-radius:5px;font-size:13px;font-family:"SF Mono","Fira Code","Consolas",monospace;flex-wrap:wrap}
.ri:hover{background:#eef0f7}
.ri .ix{font-size:11px;color:var(--text3);min-width:28px;text-align:right;flex-shrink:0}
.rb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.rb.r1{background:var(--pri)}
.rb.r2{background:var(--green)}
.rb.r3{background:var(--red)}
.rb.bb{background:var(--amber)}
.rb.pl{background:transparent;color:var(--text3);width:auto;font-size:13px}
.empty-state{text-align:center;padding:40px 16px;color:var(--text3);font-size:13px}
.empty-state .icon{font-size:32px;margin-bottom:8px;opacity:.5}
.pg{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.pg button{padding:5px 12px;font-size:12px;border:1px solid var(--border);border-radius:5px;background:#fff;color:var(--text2);cursor:pointer}
.pg button:hover:not(:disabled){border-color:var(--pri);color:var(--pri)}
.pg button:disabled{opacity:.4;cursor:default}
.pg .pi{font-size:12px;color:var(--text3)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--text3);margin-top:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid #f0f0f0}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}
.legend-dot.ld-exc{background:#e0e0e0}
.legend-dot.ld-r1{background:var(--pri)}
.legend-dot.ld-r2{background:var(--green)}
.legend-dot.ld-r3{background:var(--red)}
.legend-dot.ld-blue{background:var(--amber)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#f8fafc;padding:10px 24px;border-radius:8px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.exc-acts{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.exc-acts button{padding:3px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;font-size:11px;cursor:pointer;color:var(--text3)}
.exc-acts button:hover{border-color:var(--pri);color:var(--pri)}
.rand-area{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid #f0f0f0}
.rand-area label{font-size:12px;color:var(--text3)}
.rand-area input{width:60px;padding:5px 6px;border:1px solid var(--border);border-radius:4px;font-size:13px;text-align:center;outline:none}
.rand-area input:focus{border-color:var(--pri)}
.saved-panel{margin-top:16px}
.sp-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sp-title .badge{font-size:10px;padding:1px 6px;border-radius:8px;background:#f0f2f5;color:var(--text3);font-weight:400}
.saved-list{max-height:300px;overflow-y:auto}
.saved-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#f8f9fc;border-radius:5px;margin-bottom:4px;font-size:12px;font-family:"SF Mono",Consolas,monospace;gap:6px;flex-wrap:wrap}
.saved-item .nums{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.saved-item .s-time{font-size:10px;color:var(--text3);font-family:sans-serif}
.saved-item .s-acts{display:flex;gap:3px}
.saved-item .s-acts button{padding:2px 6px;border:none;border-radius:3px;font-size:10px;cursor:pointer;background:var(--pri);color:#fff}
.saved-item .s-acts button.del{background:var(--red)}
.saved-empty{text-align:center;padding:20px;color:var(--text3);font-size:12px}
@media(max-width:480px){
  .app{padding:12px 8px}
  .panel{padding:14px}
  .e-ball{width:26px;height:26px;font-size:10px}
  header h1{font-size:17px}
  .btn{padding:7px 16px;font-size:13px}
  .ri{padding:5px 8px;font-size:12px}
  .rb{width:23px;height:23px;font-size:10px}
  .cp button{padding:2px 6px;font-size:10px;min-width:20px}
  .pos-num input{width:32px;font-size:11px;padding:3px 1px}
  .pos-table td{padding:4px 2px;font-size:11px}
  .pos-label{font-size:11px}
  .pos-table th{font-size:10px;padding:3px 2px}
}
@media(max-width:380px){
  .cp button{padding:2px 4px;min-width:18px;font-size:9px}
  .pos-num input{width:28px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>逐位筛选器 <small>每一位独立设置条件</small></h1>
    <div class="game-sw" id="gameSwitch">
      <button class="on" data-game="ssq">双色球</button>
      <button data-game="dlt">大乐透</button>
    </div>
  </header>
  <div class="main">
    <div>
      <div class="panel">
        <div class="panel-title">
          排除号码
          <span class="badge" id="poolBadge">池: 33 / 16</span>
        </div>
        <div class="exc-acts">
          <button id="excRedAll">全排红</button>
          <button id="excRedOdd">奇</button>
          <button id="excRedEven">偶</button>
          <button id="excClear">清空</button>
        </div>
        <div class="exc-grid" id="excRedGrid"></div>
        <div style="margin-top:6px;font-size:10px;color:var(--text3)">蓝球排除</div>
        <div class="exc-grid" id="excBlueGrid" style="max-height:80px"></div>
      </div>
      <div class="panel">
        <div class="panel-title">
          逐位条件
          <span class="badge" id="condBadge">红 6 + 蓝 1</span>
        </div>
        <div id="posContainer"></div>
        <div class="sec-title">区间比 <small>整体区间分布，如231=2:3:1，可添加多个</small></div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px" id="zonePresets"></div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px">
          <input id="zoneInput" placeholder="231" maxlength="3" style="width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;outline:none">
          <button class="btn btn-sm btn-outline" onclick="addZP()" style="font-size:11px;padding:3px 10px">+ 添加</button>
        </div>
        <div id="zoneTags" style="display:flex;flex-wrap:wrap;gap:4px;min-height:26px"></div>
      </div>
      <div class="panel saved-panel">
        <div class="sp-title">
          已保存结果
          <span class="badge" id="savedBadge">0</span>
          <button class="btn btn-sm btn-danger" id="clearAllSaved" style="margin-left:auto;padding:2px 8px;font-size:10px">清空</button>
        </div>
        <div class="saved-list" id="savedList">
          <div class="saved-empty">暂无保存结果</div>
        </div>
      </div>
      <div class="panel" style="margin-bottom:0">
        <div class="acts" style="border-top:none;padding-top:0;margin-top:0">
          <button class="btn btn-primary" id="btnFilter">筛选号码</button>
          <button class="btn btn-outline" id="btnClear">重置</button>
          <button class="btn btn-success btn-sm" id="btnSaveCurrent" style="display:none">保存本次</button>
          <span style="margin-left:auto;font-size:12px;color:var(--text3)">
            组合 <span id="totalCombos" style="font-weight:700;color:var(--pri)">-</span>
          </span>
        </div>
        <div class="err-msg" id="errMsg"></div>
      </div>
    </div>
    <div>
      <div class="panel" style="margin-bottom:0">
        <div class="res-hdr">
          <span>筛选结果</span>
          <div style="display:flex;gap:10px;font-size:12px;color:var(--text3)">
            <span>匹配 <strong id="countResult" style="color:var(--pri)">-</strong> 注</span>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm btn-primary" id="btnCopyAll" style="display:none;font-size:11px;padding:3px 10px" onclick="copyAll()">复制全部</button>
            <button class="btn btn-sm btn-outline" id="btnCopyPage" style="display:none;font-size:11px;padding:3px 10px" onclick="copyPage()">复制本页</button>
          </div>
            <span>耗时 <strong id="timeResult">-</strong> ms</span>
          </div>
        </div>
        <div class="info-bar" id="infoBar">
          <span style="color:var(--text3)">设置条件后点击「筛选号码」</span>
        </div>
        <div class="results" id="resArea">
          <div class="empty-state">
            <div class="icon">🔍</div>
            <div>设置条件后点击筛选</div>
          </div>
        </div>
        <div class="pg" id="pgArea" style="display:none"></div>
        <div class="rand-area" id="randArea" style="display:none">
          <label>随机选取</label>
          <input type="number" id="randCount" value="5" min="1" max="100">
          <label style="font-size:12px;color:var(--text3)">注</label>
          <button class="btn btn-success btn-sm" id="btnRandom">选取</button>
        </div>
      </div>
    </div>
  </div>
  <div class="legend" style="max-width:1100px;margin:16px auto 0;padding:12px 0 0;border-top:1px solid #e0e0e0">
    <span class="legend-item"><span class="legend-dot ld-exc"></span> 排除</span>
    <span class="legend-item"><span class="legend-dot ld-r1"></span> 一区 / 0路</span>
    <span class="legend-item"><span class="legend-dot ld-r2"></span> 二区 / 1路</span>
    <span class="legend-item"><span class="legend-dot ld-r3"></span> 三区 / 2路</span>
    <span class="legend-item"><span class="legend-dot ld-blue"></span> 蓝球</span>
  </div>
</div>
<div id="toast"></div>
<script>
const G = {
  ssq: { name:'双色球', rN:6, rM:33, bN:1, bM:16, zones:[11,22,33] },
  dlt: { name:'大乐透', rN:5, rM:35, bN:2, bM:12, zones:[12,24,35] }
};
let gk = 'ssq';
function ga() { return G[gk]; }
function p2(n) { return String(n).padStart(2,'0'); }
function zi(n) { const z=ga().zones; if(n<=z[0]) return 0; if(n<=z[1]) return 1; return 2; }
function rt(n) { return n % 3; }
function matchP(num, p) {
  if (p.f!==null && p.f!==undefined) return num===p.f;
  if (p.p!=='a' && (num%2)!==p.p) return 0;
  if (p.r!=='a' && (num%3)!==p.r) return 0;
  if (p.z!=='a' && zi(num)!==p.z) return 0;
  return 1;
}
const S = {
  exc: new Set(), bExc: new Set(),
  res: [], cp: 0, P: 50
};
let zonePatterns=[];
function rP() {
  const rows = document.querySelectorAll('#posContainer .pos-row');
  const red=[], blue=[];
  const rC = ga().rN;
  rows.forEach((row,i)=>{
    const isR = i < rC;
    const p = {f:null, p:'a', r:'a', z:'a'};
    const inp = row.querySelector('.pos-num input');
    if (inp && inp.value.trim()) { const v=parseInt(inp.value); if(v>=1&&v<=ga().rM) p.f=v; }
    row.querySelectorAll('.cp button.on').forEach(b=>{
      const g=b.dataset.grp, v=b.dataset.val;
      if (g==='p') p.p = v==='a' ? 'a' : parseInt(v);
      if (g==='r') p.r = v==='a' ? 'a' : parseInt(v);
      if (g==='z') p.z = v==='a' ? 'a' : parseInt(v);
    });
    if (isR) red.push(p); else blue.push(p);
  });
  return {red, blue};
}
function genR(ps) {
  const n=ga().rN, mx=ga().rM, exc=S.exc;
  const res=[], MAX=200000;
  const fns=ps.filter(p=>p.f!==null).map(p=>p.f);
  if(new Set(fns).size!==fns.length) return {e:'红球存在重复确定号码'};
  for(const fn of fns) if(exc.has(fn)) return {e:'确定号码 '+p2(fn)+' 已被排除'};
  for(let i=0;i<n;i++){let ok=0;for(let x=1;x<=mx;x++){if(exc.has(x))continue;if(matchP(x,ps[i])){ok=1;break}}if(!ok)return{e:'第'+(i+1)+'位无可用号码'}}
  function bt(pos,cur,last){if(res.length>=MAX)return;if(pos===n){res.push([...cur]);return};const st=Math.max(1,last+1);for(let x=st;x<=mx;x++){if(exc.has(x))continue;if(!matchP(x,ps[pos]))continue;cur.push(x);bt(pos+1,cur,x);cur.pop();if(res.length>=MAX)return}}
  bt(0,[],0);
  if(zonePatterns.length>0){
    const valid=zonePatterns.filter(p=>p.length===3&&/^\d{3}$/.test(p)).map(p=>p.split("").map(Number));
    if(valid.length>0){
      const filtered=res.filter(c=>{
        const cz=[0,0,0];
        for(const n of c)cz[zi(n)]++;
        return valid.some(([a,b,c2])=>cz[0]===a&&cz[1]===b&&cz[2]===c2);
      });
      if(filtered.length===0) return {e:"区间比无匹配组合"};
      return {res:filtered};
    }
  }
  if(res.length>=MAX) return {e:'组合过多（超过20万），请增加条件',res};
  return {res};
}
function genB(ps) {
  const n=ga().bN, mx=ga().bM, exc=S.bExc;
  const res=[];
  const fns=ps.filter(p=>p.f!==null).map(p=>p.f);
  if(new Set(fns).size!==fns.length) return {e:'蓝球存在重复确定号码'};
  for(const fn of fns) if(exc.has(fn)) return {e:'蓝球确定号码 '+p2(fn)+' 已被排除'};
  for(let i=0;i<n;i++){let ok=0;for(let x=1;x<=mx;x++){if(exc.has(x))continue;if(matchP(x,ps[i])){ok=1;break}}if(!ok)return{e:'蓝球第'+(i+1)+'位无可用号码'}}
  function bt(pos,cur,last){if(pos===n){res.push([...cur]);return};const st=Math.max(1,last+1);for(let x=st;x<=mx;x++){if(exc.has(x))continue;if(!matchP(x,ps[pos]))continue;cur.push(x);bt(pos+1,cur,x);cur.pop()}}
  bt(0,[],0);
  return {res};
}
function doF() {
  const t0=performance.now();
  document.getElementById('errMsg').textContent='';
  const {red:rp,blue:bp}=rP();
  const rr=genR(rp);
  if(rr.e){showToast(rr.e);document.getElementById('errMsg').textContent=rr.e;return}
  if(!rr.res||rr.res.length===0){
    document.getElementById('infoBar').innerHTML='红球无匹配组合';
    document.getElementById('resArea').innerHTML='<div class="empty-state"><div class="icon">🔍</div><div>红球无匹配组合</div></div>';
  document.getElementById('pgArea').style.display='none';document.getElementById('randArea').style.display='none';document.getElementById('btnCopyAll').style.display='none';document.getElementById('btnCopyPage').style.display='none';
    document.getElementById('countResult').textContent='0';document.getElementById('totalCombos').textContent='0';
    document.getElementById('timeResult').textContent=(performance.now()-t0).toFixed(1);return;
  }
  const br=genB(bp);
  if(br.e){showToast(br.e);document.getElementById('errMsg').textContent=br.e;return}
  if(!br.res||br.res.length===0){showToast('蓝球无匹配组合');return}
  const all=[];
  for(const r of rr.res) for(const b of br.res) all.push({r,b});
  const dt=performance.now()-t0;
  S.res=all;S.cp=0;
  document.getElementById('countResult').textContent=all.length.toLocaleString();
  document.getElementById('timeResult').textContent=dt.toFixed(1);
  document.getElementById('totalCombos').textContent=all.length.toLocaleString();
  document.getElementById('infoBar').innerHTML='找到 <span class="hl">'+all.length.toLocaleString()+'</span> 注 <span class="cost">(≈¥'+(all.length*2).toLocaleString()+')</span> <span class="note">红 '+rr.res.length+' x 蓝 '+br.res.length+'</span>';
  renderR();
  document.getElementById('randArea').style.display='flex';
  document.getElementById('btnCopyAll').style.display='';
  document.getElementById('btnCopyPage').style.display='';
  document.getElementById('btnSaveCurrent').style.display='';
}
function renderR() {
  const el=document.getElementById('resArea'),pg=document.getElementById('pgArea');
  const total=S.res.length,P=S.P,pages=Math.ceil(total/P)||1;
  if(S.cp>=pages)S.cp=pages-1;
  const st=S.cp*P,en=Math.min(st+P,total),page=S.res.slice(st,en);
  let h='<div class="res-list">';
  for(let i=0;i<page.length;i++){
    const r=page[i];
    h+='<div class="ri"><span class="ix">'+(st+i+1)+'.</span>';
    for(const n of r.r){const z=zi(n);h+='<span class="rb '+(z===0?'r1':z===1?'r2':'r3')+'">'+p2(n)+'</span>'}
    h+='<span class="rb pl">+</span>';
    for(const n of r.b)h+='<span class="rb bb">'+p2(n)+'</span>';
    h+='</div>';
  }
  h+='</div>';
  if(page.length===0)h='<div class="empty-state"><div class="icon">🔍</div><div>无匹配组合</div></div>';
  el.innerHTML=h;
  if(pages<=1){pg.style.display='none';return}
  pg.style.display='flex';pg.innerHTML='';
  function pb(t,f,d){const b=document.createElement('button');b.textContent=t;b.disabled=!!d;b.addEventListener('click',f);pg.appendChild(b)}
  pb('<<',()=>{S.cp=0;renderR()},S.cp===0);
  pb('<',()=>{S.cp=Math.max(0,S.cp-1);renderR()},S.cp===0);
  const pn=document.createElement('span');pn.className='pi';pn.textContent=(S.cp+1)+'/'+pages;pg.appendChild(pn);
  pb('>',()=>{S.cp=Math.min(pages-1,S.cp+1);renderR()},S.cp>=pages-1);
  pb('>>',()=>{S.cp=pages-1;renderR()},S.cp>=pages-1);
}
function doRand() {
  if(S.res.length===0){showToast('请先筛选号码');return}
  const cnt=Math.min(Math.max(parseInt(document.getElementById('randCount').value)||1,1),S.res.length,100);
  const pk=[],is=new Set();
  while(is.size<cnt)is.add(Math.floor(Math.random()*S.res.length));
  for(const i of is)pk.push(S.res[i]);
  S.res=pk;S.cp=0;renderR();
  document.getElementById('countResult').textContent=pk.length.toLocaleString();
  document.getElementById('randArea').style.display='none';
  document.getElementById('btnCopyAll').style.display='';
  document.getElementById('btnCopyPage').style.display='';
  document.getElementById('btnSaveCurrent').style.display='';
  showToast('已随机选取 '+cnt+' 注');
}
function doSave() {
  if(!S.res||S.res.length===0){showToast('无结果可保存');return}
  const d=getSD();
  d.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),game:gk,time:new Date().toLocaleString('zh-CN',{hour12:false}),cnt:S.res.length,res:S.res});
  localStorage.setItem('lottery_filter_v2',JSON.stringify(d));
  renderSv();showToast('已保存 '+S.res.length.toLocaleString()+' 注');
}
function getSD(){try{return JSON.parse(localStorage.getItem('lottery_filter_v2'))||[]}catch{return[]}}
function delSv(id){const d=getSD().filter(x=>x.id!==id);localStorage.setItem('lottery_filter_v2',JSON.stringify(d));renderSv()}
function clearAllSv(){localStorage.setItem('lottery_filter_v2','[]');renderSv();showToast('已清空全部')}
function renderSv(){
  const el=document.getElementById('savedList'),data=getSD();
  document.getElementById('savedBadge').textContent=data.length;
  if(!data.length){el.innerHTML='<div class="saved-empty">暂无保存结果</div>';return}
  el.innerHTML=data.map(d=>{
    const gl=d.game==='dlt'?'大乐透':'双色球';
    const sm=d.res.slice(0,3).map(s=>s.r.map(n=>p2(n)).join(' ')+' + '+s.b.map(n=>p2(n)).join(' ')).join(' | ');
    const mr=d.res.length>3?' ...等':'';
    return '<div class="saved-item"><div class="nums">'+sm+mr+'</div><div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><span class="s-time">'+gl+' '+d.cnt.toLocaleString()+'注 '+d.time+'</span><div class="s-acts"><button onclick="copySaved(\''+d.id+'\')" style="background:var(--green)">复</button><button onclick="delSv(\''+d.id+'\')" class="del">删</button></div></div></div>';
  }).join('');
}
function copyAll(){
  if(!S.res||S.res.length===0){showToast("暂无结果可复制");return}
  const lines=S.res.map(s=>s.r.map(p2).join(" ")+" + "+s.b.map(p2).join(" "));
  const txt=ga().name+" 筛选结果 ("+S.res.length+"注)\n"+"=".repeat(30)+"\n"+lines.join("\n");
  navigator.clipboard.writeText(txt).then(()=>showToast("已复制全部 "+S.res.length.toLocaleString()+" 注")).catch(()=>{
    const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);showToast("已复制")
  });
}
function copyPage(){
  if(!S.res||S.res.length===0){showToast("暂无结果可复制");return}
  const st=S.cp*S.P,en=Math.min(st+S.P,S.res.length),page=S.res.slice(st,en);
  const lines=page.map((s,i)=>"第"+(st+i+1)+"注: "+s.r.map(p2).join(" ")+" + "+s.b.map(p2).join(" "));
  navigator.clipboard.writeText(lines.join("\n")).then(()=>showToast("已复制本页 "+page.length+" 注")).catch(()=>{
    const ta=document.createElement("textarea");ta.value=lines.join("\n");ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);showToast("已复制")
  });
}
function copySaved(id){
  const d=getSD().find(x=>x.id===id);if(!d)return
  const txt=d.res.map(s=>s.r.map(p2).join(" ")+" + "+s.b.map(p2).join(" ")).join("\n");
  navigator.clipboard.writeText(txt).then(()=>showToast("已复制")).catch(()=>{
    const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);showToast("已复制")
  });
}
function doClear() {
  S.exc.clear();S.bExc.clear();S.res=[];S.cp=0;zonePatterns=[];
  S.exc.clear();S.bExc.clear();S.res=[];S.cp=0;
  buildUI();
  renderExc();
  document.getElementById('infoBar').innerHTML='<span style="color:var(--text3)">设置条件后点击「筛选号码」</span>';
  document.getElementById('resArea').innerHTML='<div class="empty-state"><div class="icon">🔍</div><div>设置条件后点击筛选</div></div>';
  document.getElementById('pgArea').style.display='none';document.getElementById('randArea').style.display='none';document.getElementById('btnCopyAll').style.display='none';document.getElementById('btnCopyPage').style.display='none';
  document.getElementById('btnSaveCurrent').style.display='none';
  document.getElementById('countResult').textContent='-';document.getElementById('timeResult').textContent='-';
  document.getElementById('totalCombos').textContent='-';document.getElementById('errMsg').textContent='';
}
function swG(game) {
  if(game===gk)return;
  gk=game;
  document.querySelectorAll('#gameSwitch button').forEach(b=>b.classList.remove('on'));
  document.querySelector('#gameSwitch button[data-game="'+game+'"]').classList.add('on');
  doClear();
}
function renderExc() {
  const rEl=document.getElementById('excRedGrid');rEl.innerHTML='';
  for(let i=1;i<=ga().rM;i++){const b=document.createElement('button');b.className='e-ball';if(S.exc.has(i))b.classList.add('exc');b.textContent=p2(i);b.addEventListener('click',()=>{if(S.exc.has(i))S.exc.delete(i);else S.exc.add(i);renderExc();updB()});rEl.appendChild(b)}
  const bEl=document.getElementById('excBlueGrid');bEl.innerHTML='';
  for(let i=1;i<=ga().bM;i++){const b=document.createElement('button');b.className='e-ball e-blue';if(S.bExc.has(i))b.classList.add('exc');b.textContent=p2(i);b.addEventListener('click',()=>{if(S.bExc.has(i))S.bExc.delete(i);else S.bExc.add(i);renderExc();updB()});bEl.appendChild(b)}
  updB();
}
function updB() {
  const rA=ga().rM-S.exc.size,bA=ga().bM-S.bExc.size;
  document.getElementById('poolBadge').textContent='池: '+rA+' / '+bA;
  document.getElementById('condBadge').textContent='红 '+ga().rN+' + 蓝 '+ga().bN;
}
function buildUI() {
  const c=document.getElementById('posContainer');c.innerHTML='';
  const rt=document.createElement('div');rt.className='sec-title';rt.innerHTML='红球 <small>逐位设置奇偶/路数/区间，或填入确定号码</small>';c.appendChild(rt);
  c.appendChild(mkT(ga().rN,1));
  const bt=document.createElement('div');bt.className='sec-title';bt.innerHTML='蓝球 <small>逐位设置条件</small>';c.appendChild(bt);
  c.appendChild(mkT(ga().bN,0));
  updC();
}
function mkT(cnt,isR) {
  const t=document.createElement('table');t.className='pos-table';
  const mx=isR?ga().rM:ga().bM;
  let h='<tr><th>位</th><th>号</th><th>奇偶</th><th>路数</th><th>可选</th></tr>';
  t.innerHTML=h;
  for(let i=0;i<cnt;i++){
    const tr=document.createElement('tr');tr.className='pos-row';tr.dataset.idx=i;tr.dataset.isR=isR?'1':'0';
    const l=document.createElement('td');l.className='pos-label';l.textContent=i+1;tr.appendChild(l);
    const nc=document.createElement('td');nc.className='pos-num';
    const ni=document.createElement('input');ni.type='number';ni.min=1;ni.max=mx;ni.placeholder='—';
    ni.addEventListener('input',function(){if(this.value){const v=parseInt(this.value);if(v<1||v>mx){this.value='';return}this.classList.add('filled')}else{this.classList.remove('filled')}updC()});
    nc.appendChild(ni);tr.appendChild(nc);
    const pc=document.createElement('td');const pd=document.createElement('div');pd.className='cp';addP(pd,'p','奇',1,tr);addP(pd,'p','偶',0,tr);addP(pd,'p','不','a',tr,1);pc.appendChild(pd);tr.appendChild(pc);
    const rc=document.createElement('td');const rd=document.createElement('div');rd.className='cp';addP(rd,'r','0',0,tr);addP(rd,'r','1',1,tr);addP(rd,'r','2',2,tr);addP(rd,'r','不','a',tr,1);rc.appendChild(rd);tr.appendChild(rc);
    const ac=document.createElement('td');const ab=document.createElement('span');ab.className='avail-badge';ab.id='ab_'+(isR?'r':'b')+'_'+i;ab.innerHTML='<span class="n">~</span>';ac.appendChild(ab);tr.appendChild(ac);
    t.appendChild(tr);
  }
  return t;
}
function addP(ct,grp,lb,val,row,def) {
  const b=document.createElement('button');b.textContent=lb;b.dataset.grp=grp;b.dataset.val=val;if(def)b.classList.add('on');
  b.addEventListener('click',function(){const sibs=row.querySelectorAll('.cp button[data-grp="'+grp+'"]');sibs.forEach(s=>s.classList.remove('on'));this.classList.add('on');updC()});
  ct.appendChild(b);
}
function updC() {
  document.querySelectorAll('.pos-row').forEach((row,idx)=>{
    const isR=row.dataset.isR==='1',mx=isR?ga().rM:ga().bM,ex=isR?S.exc:S.bExc;
    const p=rSP(row);const bdg=row.querySelector('.avail-badge .n');if(!bdg)return;
    let cnt=0;for(let n=1;n<=mx;n++){if(ex.has(n))continue;if(matchP(n,p))cnt++}
    bdg.textContent=cnt>0?cnt:'x';bdg.style.color=cnt>0?'var(--pri)':'var(--red)';
  });
}
function rSP(row) {
  const p={f:null,p:'a',r:'a',z:'a'};
  const inp=row.querySelector('.pos-num input');
  if(inp&&inp.value.trim()){const v=parseInt(inp.value);if(!isNaN(v))p.f=v}
  row.querySelectorAll('.cp button.on').forEach(b=>{const g=b.dataset.grp,v=b.dataset.val;if(g==='p')p.p=v==='a'?'a':parseInt(v);if(g==='r')p.r=v==='a'?'a':parseInt(v);if(g==='z')p.z=v==='a'?'a':parseInt(v)});
  return p;
}
// ===== ZONE PATTERNS =====
function addZP(pat){
  pat=pat||document.getElementById("zoneInput").value.trim();
  if(!pat||!/^\d{3}$/.test(pat)){showToast("请输入3位数区间比");return}
  const n=ga().rN;
  if(pat.split("").reduce((a,b)=>a+parseInt(b),0)!==n){showToast("区间比数位之和必须等于"+n);return}
  if(zonePatterns.includes(pat)){showToast("已存在此区间比");return}
  zonePatterns.push(pat);
  document.getElementById("zoneInput").value="";
  renderZTags();
}
function rmZP(idx){zonePatterns.splice(idx,1);renderZTags()}
function renderZTags(){
  const el=document.getElementById("zoneTags");
  if(zonePatterns.length===0){el.innerHTML="<span style=\"font-size:11px;color:var(--text3)\">点击预设或输入添加</span>";return}
  el.innerHTML=zonePatterns.map((p,i)=>"<span style=\"display:inline-flex;align-items:center;gap:3px;padding:3px 8px;background:#e8ecff;border-radius:4px;font-size:12px;font-weight:600;color:var(--pri)\">"+p+"<button onclick=\"rmZP("+i+")\" style=\"border:none;background:none;color:var(--pri);cursor:pointer;font-size:14px;line-height:1;padding:0 2px;opacity:.5\">x</button></span>").join("");
}
function initZP(){
  const el=document.getElementById("zonePresets");el.innerHTML="";
  const arr=ga().rN===6?["222","321","411","312","231","132","123"]:["221","311","131","212","122","113"];
  arr.forEach(p=>{const b=document.createElement("button");b.textContent=p.split("").join(":");b.style.cssText="font-size:11px;padding:3px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;color:var(--text2);margin-right:4px";b.addEventListener("click",()=>addZP(p));el.appendChild(b)});
  document.getElementById("zoneInput").addEventListener("keydown",function(e){if(e.key==="Enter")addZP()});
  renderZTags();
}
let tt;
function showToast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2200)}
document.querySelectorAll('#gameSwitch button').forEach(b=>b.addEventListener('click',function(){swG(this.dataset.game)}));
document.getElementById('excRedAll').addEventListener('click',()=>{S.exc.clear();for(let i=1;i<=ga().rM;i++)S.exc.add(i);renderExc()});
document.getElementById('excRedOdd').addEventListener('click',()=>{for(let i=1;i<=ga().rM;i+=2)S.exc.add(i);renderExc()});
document.getElementById('excRedEven').addEventListener('click',()=>{for(let i=2;i<=ga().rM;i+=2)S.exc.add(i);renderExc()});
document.getElementById('excClear').addEventListener('click',()=>{S.exc.clear();S.bExc.clear();renderExc()});
document.getElementById('btnFilter').addEventListener('click',doF);
document.getElementById('btnClear').addEventListener('click',doClear);
document.getElementById('btnRandom').addEventListener('click',doRand);
document.getElementById('btnSaveCurrent').addEventListener('click',doSave);
document.getElementById('clearAllSaved').addEventListener('click',clearAllSv);
renderExc();
buildUI();
renderSv();
initZP();
</script>
</body>
</html>
